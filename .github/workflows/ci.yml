name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run complete local verification
        run: npm run verify
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: npm

  package-manager-fixtures:
    name: package fixture / ${{ matrix.manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install pnpm
        if: matrix.manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - name: Install Yarn
        if: matrix.manager == 'yarn'
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: npm ci --ignore-scripts
      - name: Install and invoke packed Zedbee
        run: npm test -- test/e2e/package-managers.test.ts
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: ${{ matrix.manager }}
