name: CI

on:
  # Run local verification before pushing. Hosted checks are opt-in; automatic
  # release-tag verification lives in release-check.yml.
  workflow_dispatch:
    inputs:
      snapshot_baseline:
        description: Optional immutable baseline ref for the primary snapshot performance gate
        required: false
        type: string
        default: ""
      snapshot_extended:
        description: Run the complete fixture, cache, and executor matrix on isolated Linux Node 24 runners
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot-performance:
    if: ${{ inputs.snapshot_baseline != '' }}
    name: Snapshot preparation / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Measure clean base/head builds and enforce the primary gates
        run: node --experimental-strip-types bench/snapshot-ci.mts
        env:
          SNAPSHOT_BASELINE_REF: ${{ inputs.snapshot_baseline }}
          ZEDBEE_TELEMETRY_DISABLED: "1"
      - name: Retain raw samples and gate decisions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/snapshot-performance*.json
          if-no-files-found: warn

  snapshot-matrix:
    if: ${{ inputs.snapshot_extended && inputs.snapshot_baseline != '' }}
    name: Snapshot matrix / ${{ matrix.size }} / ${{ matrix.scenario }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        size: [100, 4000, 20000]
        scenario: [json, ts, config, large]
        mode:
          - preparation
          - off-local
          - off-cold-service
          - off-warm-service
          - cold-local
          - cold-cold-service
          - cold-warm-service
          - warm-local
          - warm-cold-service
          - warm-warm-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Measure one complete paired matrix cell
        run: node --experimental-strip-types bench/snapshot-ci.mts
        env:
          SNAPSHOT_BASELINE_REF: ${{ inputs.snapshot_baseline }}
          SNAPSHOT_MATRIX_MODE: ${{ matrix.mode }}
          SNAPSHOT_MATRIX_SIZE: ${{ matrix.size }}
          SNAPSHOT_MATRIX_SCENARIO: ${{ matrix.scenario }}
          ZEDBEE_TELEMETRY_DISABLED: "1"
      - name: Retain raw paired samples and the cell decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-matrix-${{ matrix.size }}-${{ matrix.scenario }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/snapshot-performance*.json
          if-no-files-found: warn

  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run correctness verification and benchmark smoke
        run: npm run verify
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: npm
          ZEDBEE_BENCHMARK_RUNNER: ${{ matrix.os }}

  performance:
    uses: ./.github/workflows/performance-check.yml

  package-manager-fixtures:
    name: package fixture / ${{ matrix.manager }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install pnpm
        if: matrix.manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.0
      - name: Install Yarn
        if: matrix.manager == 'yarn'
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23
      - run: npm ci --ignore-scripts
      - name: Install and invoke packed Zedbee
        run: npm test -- test/e2e/package-managers.test.ts
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: ${{ matrix.manager }}
