name: Release check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: npm

  publication-gate:
    name: Publication metadata and provenance gate
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Verify release metadata, SBOM, and clean state
        run: npm run release:check
        env:
          ZEDBEE_CROSS_PLATFORM_CI_EVIDENCE: verified
      - name: Prepare and smoke-test the exact npm tarball
        run: npm run artifact:prepare
      - name: Upload the tested npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: zedbee-npm-${{ github.ref_name }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
