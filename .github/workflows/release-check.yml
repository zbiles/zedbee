name: Release check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-identity:
    name: Release identity and dependency preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/release-check.mjs --tag-check
      - run: node scripts/audit-production-dependencies.mjs --package-lock-only

  cross-platform:
    needs: release-identity
    timeout-minutes: 60
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: npm
          ZEDBEE_BENCHMARK_RUNNER: ${{ matrix.os }}

  publication-gate:
    timeout-minutes: 60
    name: Publication metadata and artifact gate
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Verify release metadata, SBOM, and clean state
        run: npm run release:check
        env:
          ZEDBEE_CROSS_PLATFORM_EVIDENCE: verified
          ZEDBEE_BENCHMARK_RUNNER: ubuntu-latest
      - name: Prepare and smoke-test the exact npm tarball
        run: npm run artifact:prepare
      - name: Upload the tested npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zedbee-npm-${{ github.ref_name }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
