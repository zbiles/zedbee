name: Release check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Synchronize matching Gitleaks package
        run: >-
          node scripts/sync-managed-binaries.mjs
          --engine gitleaks
          --version 8.28.0
          --platform ${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'win32' }}
          --arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Synchronize matching OSV-Scanner package
        run: >-
          node scripts/sync-managed-binaries.mjs
          --engine osv-scanner
          --version 2.4.0
          --platform ${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'win32' }}
          --arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - run: npm run verify
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: npm

  publication-gate:
    name: Publication metadata and provenance gate
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Synchronize matching Gitleaks package
        run: >-
          node scripts/sync-managed-binaries.mjs
          --engine gitleaks
          --version 8.28.0
          --platform linux
          --arch x64
      - name: Synchronize matching OSV-Scanner package
        run: >-
          node scripts/sync-managed-binaries.mjs
          --engine osv-scanner
          --version 2.4.0
          --platform linux
          --arch x64
      - name: Verify release-only metadata, assets, SBOM, and clean state
        run: npm run release:check
        env:
          ZEDBEE_CROSS_PLATFORM_CI_EVIDENCE: verified
