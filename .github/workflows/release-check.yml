name: Release check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  release-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    name: Release identity and dependency preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/release-check.mjs --tag-check
      - run: node scripts/audit-production-dependencies.mjs --package-lock-only

  cross-platform:
    needs: release-identity
    timeout-minutes: 60
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
        env:
          ZEDBEE_PACKAGE_MANAGER_UNDER_TEST: npm
          ZEDBEE_BENCHMARK_RUNNER: ${{ matrix.os }}

  performance:
    needs: release-identity
    uses: ./.github/workflows/performance-check.yml

  publication-gate:
    timeout-minutes: 60
    name: Publication metadata and artifact gate
    needs: [cross-platform, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Verify release metadata, SBOM, and clean state
        run: npm run release:check
        env:
          ZEDBEE_CROSS_PLATFORM_EVIDENCE: verified
          ZEDBEE_PERFORMANCE_EVIDENCE: ${{ needs.performance.outputs.evidence }}
          ZEDBEE_BENCHMARK_RUNNER: ubuntu-latest
      - name: Prepare and smoke-test the exact npm tarball
        run: npm run artifact:prepare
      - name: Upload the tested npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zedbee-npm-${{ github.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/upgrade-verification.json
          if-no-files-found: error


  verify-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify the tag against the tested pre-tag artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate="$(git rev-parse HEAD)"
          run_id="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$GITHUB_REF_NAME" | sed -nE 's/.* \(run ([0-9]+)\)$/\1/p')"
          test -n "$run_id"
          gh run view "$run_id" --json headSha,conclusion,event,workflowName |
            jq -e --arg sha "$candidate" '.headSha == $sha and .conclusion == "success" and .event == "workflow_dispatch" and .workflowName == "Release check"'
          gh run download "$run_id" --name "zedbee-npm-$candidate" --dir release-artifacts
          node scripts/tag-tested-release.mjs release-artifacts --verify-tag
